[project]
name = "t20-mcp"
version = "3.1.0"
description = "T20 天正建筑 MCP Server (AutoCAD + Tangent T20 on Chinese Windows)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "ezdxf>=1.4.4",
    "matplotlib>=3.11.0",
    "mcp[cli]>=1.27.2",
    "pillow>=12.2.0",
    "pywin32>=312",
    "structlog>=26.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/t20_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
