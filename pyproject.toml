[project]
name = "t20-mcp"
version = "3.2.0"
description = "T20 天正建筑 MCP Server (AutoCAD + Tangent T20 on Chinese Windows)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "ezdxf>=1.4.4",
    "matplotlib>=3.11.0",
    "mcp[cli]>=2.0.0,<3",
    "pillow>=12.2.0",
    "pywin32>=312",
    "structlog>=26.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/t20_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"lisp-code/mcp_dispatch.lsp" = "t20_mcp/lisp_code/mcp_dispatch.lsp"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# 真机脚本需要先把仓库根与 src 加入 sys.path，再导入本地模块。
"scripts/*.py" = ["E402", "I001"]

[tool.ruff.format]
line-ending = "lf"
